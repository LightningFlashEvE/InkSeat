limit_req_zone $binary_remote_addr zone=service_admin_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=service_admin_api:10m rate=20r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index service-admin.html;
    limit_req_status 429;
    client_body_timeout 30s;

    location ~* ^/(?:Dockerfile|nginx\.conf|security_headers\.conf)$ {
        return 404;
    }

    location ~ (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }

    location = /api/service-admin/auth/login {
        limit_req zone=service_admin_auth burst=6 nodelay;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store" always;
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }

    location ^~ /api/service-admin/ {
        limit_req zone=service_admin_api burst=40 nodelay;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store" always;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
    }

    # This container exposes no ordinary tenant or device API.
    location ^~ /api/ {
        return 404;
    }

    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /service-admin.html;
    }
}
