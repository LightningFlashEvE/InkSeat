<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <title>设置新密码</title>
    <link rel="icon" href="data:;base64,=">
    <script>
        (function () {
            try {
                if (localStorage.getItem('meetingThemeMode') !== 'dark') {
                    document.documentElement.classList.add('theme-light');
                    document.documentElement.dataset.theme = 'light';
                    document.documentElement.style.colorScheme = 'light';
                }
            } catch (e) {}
        }());
    </script>
    <script src="theme.js?v=20260821devicesort7"></script>
    <link rel="stylesheet" href="ui.css?v=20260821devicesort7">
    <style>
        .change-note { margin: 0 0 18px; color: #718096; font-size: .86rem; line-height: 1.55; }
        .change-actions { display: grid; gap: 10px; }
    </style>
</head>
<body class="login-page">
    <main class="card">
        <div class="title">
            <h1>设置新密码</h1>
            <p>临时密码仅用于本次身份确认</p>
        </div>
        <p class="change-note">输入收到的临时密码，再设置一个至少 8 位的新密码。修改成功后需要重新登录。</p>
        <form id="changeForm">
            <div class="field">
                <label for="currentPassword">临时密码</label>
                <input id="currentPassword" type="password" autocomplete="current-password" required>
            </div>
            <div class="field">
                <label for="newPassword">新密码</label>
                <input id="newPassword" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirmPassword">确认新密码</label>
                <input id="confirmPassword" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
            </div>
            <div class="change-actions">
                <button class="btn btn-primary" type="submit">保存新密码</button>
                <button class="btn btn-secondary" type="button" id="logoutButton">退出并返回登录</button>
            </div>
        </form>
        <div id="status" class="status" role="status">完成修改后即可继续管理你的设备</div>
    </main>
    <script src="auth.js?v=20260821devicesort7"></script>
    <script>
        const statusNode = document.getElementById('status');
        function setStatus(message, type = '') {
            statusNode.textContent = message;
            statusNode.className = `status${type ? ` ${type}` : ''}`;
        }

        document.getElementById('changeForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmation = document.getElementById('confirmPassword').value;
            if (newPassword !== confirmation) {
                setStatus('两次输入的新密码不一致', 'error');
                return;
            }
            try {
                const response = await authFetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({currentPassword, newPassword})
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success) {
                    setStatus(data.error || '密码修改失败', 'error');
                    return;
                }
                clearAuth();
                setStatus(data.message, 'success');
                setTimeout(() => window.location.replace('login.html?v=20260821devicesort7'), 700);
            } catch (error) {
                setStatus(error.message || '密码修改失败', 'error');
            }
        });

        document.getElementById('logoutButton').addEventListener('click', () => {
            clearAuth();
            window.location.replace('login.html?v=20260821devicesort7');
        });

        requireAuth().catch((error) => setStatus(error.message, 'error'));
    </script>
</body>
</html>
