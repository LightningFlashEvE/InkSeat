<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>用户登录</title>
    <link rel="icon" href="data:;base64,=">
    <script>
        (function () {
            try {
                if (localStorage.getItem('meetingThemeMode') !== 'dark') {
                    document.documentElement.classList.add('theme-light');
                    document.documentElement.dataset.theme = 'light';
                    document.documentElement.style.colorScheme = 'light';
                }
            } catch (e) {}
        }());
    </script>
    <style>
        html.theme-light,
        html[data-theme="light"] {
            background: #eef5f7 !important;
            color-scheme: light;
        }

        html.theme-light body,
        html[data-theme="light"] body {
            color: #0b1720 !important;
            background: #eef5f7 !important;
        }
    </style>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 360px;
            background: white;
            border-radius: 16px;
            padding: 30px 28px 26px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.25);
        }
        .title {
            text-align: center;
            margin-bottom: 20px;
        }
        .title h1 {
            font-size: 1.6em;
            color: #2d3748;
            margin-bottom: 6px;
        }
        .title p {
            font-size: 0.9em;
            color: #718096;
        }
        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 0.9em;
            color: #4a5568;
            margin-bottom: 4px;
        }
        .field input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: 0.95em;
        }
        .field input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 1px rgba(102,126,234,0.3);
        }
        .field small {
            display: block;
            margin-top: 5px;
            color: #718096;
            font-size: 0.78em;
            line-height: 1.45;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            box-shadow: 0 8px 20px rgba(102,126,234,0.45);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .status {
            margin-top: 12px;
            font-size: 0.85em;
            color: #718096;
            min-height: 18px;
        }
        .status.error {
            color: #e53e3e;
        }
        .status.success {
            color: #38a169;
        }
    </style>
    <script src="theme.js?v=20260803select1"></script>
    <link rel="stylesheet" href="ui.css?v=20260803select1">
</head>
<body class="login-page">
    <div class="card">
        <div class="title">
            <h1>会议牌管理</h1>
            <p>登录后管理属于你的设备</p>
        </div>

        <form id="authForm" onsubmit="onLogin(); return false;">
            <div class="field">
                <label for="username">用户名</label>
                <input id="username" type="text" placeholder="输入用户名" autocomplete="username">
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" type="password" placeholder="输入密码" autocomplete="current-password">
            </div>
            <div class="field">
                <label for="bootstrapToken">首次管理员引导令牌</label>
                <input id="bootstrapToken" type="password" placeholder="仅首次注册管理员时填写" autocomplete="off">
                <small>取自服务器 <code>ADMIN_BOOTSTRAP_TOKEN</code>；普通登录请留空。</small>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" type="button" onclick="onRegister()">注册</button>
                <button class="btn btn-primary" type="submit">登录</button>
            </div>
        </form>

        <div id="status" class="status">首次使用请先注册账号</div>
    </div>

    <script src="auth.js?v=20260803select1"></script>
    <script>
        function setStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status' + (type ? ' ' + type : '');
        }

        async function onRegister() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const bootstrapToken = document.getElementById('bootstrapToken').value.trim();

            if (!username || !password) {
                setStatus('用户名和密码不能为空', 'error');
                return;
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, bootstrapToken })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success) {
                    document.getElementById('bootstrapToken').value = '';
                    setStatus('注册成功，请点击登录', 'success');
                } else if (res.status === 429) {
                    setStatus('操作过于频繁，请稍后再试', 'error');
                } else {
                    setStatus(data.error || `注册失败（HTTP ${res.status}）`, 'error');
                }
            } catch (e) {
                console.error(e);
                setStatus('注册失败: ' + e.message, 'error');
            }
        }

        async function onLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                setStatus('用户名和密码不能为空', 'error');
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success && data.token) {
                    setAuth(data.token, data.user);
                    setStatus('登录成功，正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html?v=20260803select1';
                    }, 600);
                } else if (res.status === 429) {
                    setStatus('登录尝试过于频繁，请稍后再试', 'error');
                } else {
                    setStatus(data.error || `登录失败（HTTP ${res.status}）`, 'error');
                }
            } catch (e) {
                console.error(e);
                setStatus('登录失败: ' + e.message, 'error');
            }
        }
    </script>
</body>
</html>
