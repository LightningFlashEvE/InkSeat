# The production ingress must overwrite X-Real-IP. Restore the client address
# before applying rate and connection limits so all users do not share the
# Docker bridge or loopback proxy address.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Real-IP;
real_ip_recursive on;

limit_conn_zone $binary_remote_addr zone=upload_per_ip:10m;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pairing_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=device_status_per_ip:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=60r/s;

# Only explicitly versioned assets are immutable. Unversioned vendor/icon files
# revalidate quickly so a deployment cannot leave clients stale for 30 days.
map $arg_v $static_cache_control {
    ""      "public, max-age=3600, must-revalidate";
    default "public, max-age=2592000, immutable";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    limit_req_status 429;
    limit_conn_status 429;
    client_body_timeout 30s;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 429 '{"success":false,"error":"Too many requests"}';
    }

    # Development bind mounts must not make local configuration files public.
    location ~* ^/(?:Dockerfile|nginx\.conf|security_headers\.conf)$ {
        return 404;
    }

    location ~ (^|/)\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* \.(?:bak|conf|env|ini|log|sql|ya?ml)$ {
        return 404;
    }

    # Login and registration have a strict per-IP limit to slow brute force.
    location ~ ^/api/auth/(?:login|register)$ {
        limit_req zone=auth_per_ip burst=6 nodelay;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        client_max_body_size 64k;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Pairing codes are intentionally short-lived and human-readable. Keep
    # claim attempts on a separate, much slower bucket than normal device API.
    location ~ ^/api/(?:devices/add|device/claim)$ {
        limit_req zone=pairing_per_ip burst=5 nodelay;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        client_max_body_size 16k;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Status is called by deep-sleep devices and may trigger template rendering.
    # Keep a generous NAT-friendly burst while preventing an unbounded hot loop.
    location = /api/device/status {
        limit_req zone=device_status_per_ip burst=60 nodelay;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        client_max_body_size 8k;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Expensive or upload-heavy endpoints receive route-specific body and
    # concurrency budgets. These exact matches take precedence over /api/.
    location = /api/nameplates/parse {
        limit_req zone=api_per_ip burst=10 nodelay;
        limit_conn upload_per_ip 2;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        client_max_body_size 20M;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 110s;
    }

    location = /api/nameplates/preview {
        limit_req zone=api_per_ip burst=12 nodelay;
        limit_conn upload_per_ip 2;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        client_max_body_size 6M;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location = /api/epd/process-sixcolor {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_conn upload_per_ip 2;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        client_max_body_size 12M;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 110s;
    }

    location = /api/device/template {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_conn upload_per_ip 2;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        client_max_body_size 12M;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 110s;
    }

    location = /api/pages/save {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_conn upload_per_ip 2;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        client_max_body_size 6M;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location = /api/epd/load {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_conn upload_per_ip 4;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        client_max_body_size 512k;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location = /api/nameplates/dispatch {
        limit_req zone=api_per_ip burst=5 nodelay;
        limit_conn upload_per_ip 1;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        client_max_body_size 1M;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 110s;
    }

    # API proxy. The generous burst accommodates many deep-sleep devices waking
    # behind the same NAT while still bounding accidental request floods.
    location /api/ {
        limit_req zone=api_per_ip burst=180 nodelay;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Device-Key $http_x_device_key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Large bodies are accepted only by the exact upload routes above.
        client_max_body_size 1M;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }

    # HTML entry points are never cached so they always pick up new asset keys.
    location / {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
