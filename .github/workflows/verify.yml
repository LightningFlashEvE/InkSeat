name: Verify project

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  project-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cloud_server/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check changed-line whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "$zero_sha" ]] && \
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --check --oneline HEAD
          fi
      - name: Run repository verifier
        run: python tools/verify_project.py
      - name: Install backend dependencies
        run: |
          python -m pip install -r cloud_server/backend/requirements.txt pip-audit==2.10.1
          python -m pip check
      - name: Audit backend dependencies
        run: python -m pip_audit -r cloud_server/backend/requirements.txt --progress-spinner off
      - name: Audit vendored frontend libraries
        run: npx --yes retire@5.4.3 --path cloud_server/frontend --outputformat json
      - name: Run backend regression tests
        run: python cloud_server/backend/test_app.py
